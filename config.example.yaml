# 复制为 config.yaml。修改后需要重启网关。
# 此示例使用一个 Responses 上游；可添加多个相同或不同协议的服务。
server:
  max_concurrent_requests: 64
  addr: "127.0.0.1:8176"
  read_header_timeout: "10s"
  shutdown_timeout: "5s"
  read_body_timeout: "30s"
  write_idle_timeout: "60s"
  idle_timeout: "120s"

upstreams:
  responses-main:
    response_header_timeout: "60s"
    read_idle_timeout: "120s"
    protocol: openai-responses
    base_url: "https://opencode.ai/zen/go/v1"
    api_key: "OPENAI_API_KEY" # 或使用 api_key，二者只能配置一个
    # 空字符串取消显式代理，仍遵循 HTTP_PROXY / HTTPS_PROXY / NO_PROXY。
    proxy_url: "http://127.0.0.1:1080"
    models:
      - name: "muse-spark-1.3-contributor" # 上游真实模型 ID
        alias: "muse-spark-1.3-contributor" # 下游公开名，省略时使用 name
        weight: 1 # 同一 alias 候选池中的请求份额，1～1000000
        # 能力声明只控制跨协议转换，不探测服务；仅在目标模型确实支持时取消注释。
        # compatibility:
        #   input_modalities: [text, image] # 缺省 [text]；只允许 user 图片 URL/base64，不下载
        #   json_schema: true # 缺省 false；只映射可严格等价保留的保守 schema 子集
        #   reasoning:
        #     mode: effort # Chat/Responses 仅支持 effort
        #     efforts: [none, low, medium, high] # 显式声明后不支持的级别直接拒绝，不夹取

  # chat-main:
  #   protocol: openai-compatible
  #   base_url: "https://chat.example.com/v1" # 改为实际 Chat Completions 服务
  #   api_key: "CHAT_API_KEY"
  #   proxy_url: ""
  #   models:
  #     - name: "your-chat-model"
  #       alias: coding
  #       weight: 3
  #       compatibility:
  #         chat_token_limit_field: max_tokens # 仅 Chat；显式设置才重写同协议 token 字段
  #         # 未设置时跨协议发送 max_completion_tokens，同协议保持原生字段。
  #         input_modalities: [text, image] # 必含 text，无重复；不支持文件/PDF/音视频/工具媒体
  #         json_schema: true # 不改写 schema；不支持的格式约束在出站前拒绝
  #         reasoning:
  #           mode: effort
  #           efforts: [none, low, medium, high]
  #     - name: "your-fast-model"
  #       alias: coding
  #       weight: 1

  # anthropic-main:
  #   protocol: anthropic
  #   base_url: "https://api.anthropic.com/v1"
  #   api_key: "ANTHROPIC_API_KEY"
  #   anthropic_version: "2023-06-01" # 按目标服务要求配置
  #   models:
  #     - name: "your-claude-model"
  #       alias: reasoning
  #       weight: 1
  #       compatibility:
  #         input_modalities: [text, image]
  #         json_schema: true # 转 Anthropic 要求显式 strict:true，strict:false/缺省拒绝
  #         reasoning:
  #           mode: budget # Anthropic 仅支持 budget；none 不配置预算
  #           efforts: [none, low, medium]
  #           budgets: {low: 1024, medium: 4096} # >=1024，且必须严格小于请求输出 token 上限

auth:
  gateway_api_key: "" # 空字符串表示不验证本地客户端密钥

models:
  # 以下为旧 Responses 推理回退规则；模型 compatibility.reasoning 显式声明优先。
  reasoning_efforts: [] # 可选：none、minimal、low、medium、high、xhigh
  model_reasoning_efforts: {} # 例如 {your-upstream-model: [low, medium, high]}

# 同协议图片/格式/推理不因缺省 compatibility 被拦截，由目标服务验证。
# 新跨协议路径拒绝不可迁移的签名、加密推理历史与 previous_response_id。

logging:
  requests:
    enabled: false # 显式设为 true 才记录完整请求正文
    max_total_bytes: 1073741824
    retention: "168h"
    dir: "logs/requests" # 相对路径以配置文件所在目录为基准

# 跨服务候选示例：与 chat-main 的 coding 一起按 3:1:2 分配。
# 相同真实 ID 在不同服务中可以使用不同密钥/代理。
# upstreams 下可另加（不要重复写顶层 upstreams）：
#   chat-secondary:
#     protocol: openai-compatible
#     base_url: https://secondary.example.com/v1
#     api_key_env: SECONDARY_API_KEY
#     models:
#       - name: your-chat-model
#         alias: coding
#         weight: 2
# 旧格式 name: coding / model: your-chat-model 仍可用；同条禁止 model 与 alias 混用。
